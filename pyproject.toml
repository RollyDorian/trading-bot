[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mexc-shadow"
version = "0.1.0"
description = "MEXC zero-fee scalping bot: shadow engine and Web-UI capture tooling."
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
mexc-shadow = "trading_bot.research.mexc_shadow.mvp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
exclude = [".agents", "*.yaml", "compose*.yaml"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["trading_bot"]
