<!DOCTYPE html>
<html lang="en">
  <head>

    <title>wrapper BBO with last outside the book</title>
  </head>

    <div data-mexc-capture="symbol">TAOUSDT</div>

    <section>
      <span>Order Book</span>
      <div class="market-module-scss-module__hash__asksWrapper">
        <div class="market-module-scss-module__hash__price market-module-scss-module__hash__sell">226.18</div>
      </div>
      <div class="market-module-scss-module__hash__bidsWrapper">
        <div class="market-module-scss-module__hash__price market-module-scss-module__hash__buy">226.10</div>
      </div>
    </section>
  </body>
</html>
